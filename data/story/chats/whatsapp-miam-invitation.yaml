chat:
  id: whatsapp_miam_invitation
  title: "Quelques jours plus tard"
  app: "whatsapp"
  default_avatar_state: happy
  received_message_avatar_state: blush
  participants:
    alex:
      display_name: "Alex"
      side: right
      bubble_color: green
      avatar_asset: "public/assets/characters/hero/avatar-whatsapp.png"
    anna:
      display_name: "Anna"
      side: left
      bubble_color: white
      avatar_asset: "public/assets/characters/companion/avatar-whatsapp.png"
  sequence:
    - type: message
      from: anna
      text: "Bon bah maintenant mes discussions avec les amis ressemblent à ça 🤣"
      avatar_reaction:
        alex: blush

    - type: attachment
      from: anna
      label: "Photos des pistolets"
      asset_placeholder: "public/assets/objects/pistol-photos-placeholder.png"
      avatar_reaction:
        alex: blush

    - type: message
      from: alex
      text: "ahahah excellent 😂"
      avatar_reaction:
        anna: blush

    - type: message
      from: alex
      text: "en parlant d'event, le weekend du 7 juin il y a le Miam Festival. C'est de la street food de Lausanne et autour, ça t'intéresserait ?"
      avatar_reaction:
        anna: joy_explosion

    - type: message
      from: anna
      text: "Ouii, j'ai vu et j'aimerais beaucoup y aller 😃"
      avatar_reaction:
        alex: blush

    - type: message
      from: anna
      text: "Par contre, j'étais en train d'essayer de planifier la visite de dix mille choses en une journée 😂"
      avatar_reaction:
        alex: blush

    - type: message
      from: anna
      text: "En gros, le 7 et 8 juin, il y aura Geneva Food Fest + Miam Festival de Lausanne + caves ouvertes du canton de Vaud x)"
      avatar_reaction:
        alex: blush

    - type: message
      from: anna
      text: "Du coup, j'ai deux programmes à te proposer 😂"
      avatar_reaction:
        alex: blush

    - type: attachment
      from: anna
      label: "Explication des idées"
      asset_placeholder: "public/assets/story/anna-program-ideas-placeholder.png"
      avatar_reaction:
        alex: blush

    - type: message
      from: anna
      text: "Est-ce qu'un des programmes, une partie des programmes, ou tout peut t'intéresser ? 😂"
      avatar_reaction:
        alex: blush
        anna: joy_explosion

    - type: message
      from: alex
      text: "ah oui, c'est la saison 😂 yes ! je suis chaud pour tout en vrai 🤩"
      avatar_reaction:
        anna: blush

    - type: message
      from: alex
      text: "je viens de check mon agenda et si tu veux compléter le samedi matin, je vais peut-être tirer à 50 m 😂"
      avatar_reaction:
        anna: blush

    - type: message
      from: anna
      text: "Ooh oui, ce serait une journée parfaite 😍"
      avatar_reaction:
        alex: blush

    - type: message
      from: alex
      text: "trop bien 😍 je me réjouis 🥂"
      avatar_reaction:
        anna: blush

    - type: title_card
      text: "Un jour et quelques discussions plus tard..."

    - type: message
      from: alex
      text: "je suis à PolyLAN"
      avatar_reaction:
        anna: blush

    - type: message
      from: alex
      text: "Si tu n'as rien à faire demain, feel free de me rendre visite à Beaulieu si tu veux 😛"
      avatar_reaction:
        anna: shy_blush_joy

    - type: message
      from: anna
      text: "Oui avec plaisir 😊"
      avatar_reaction:
        alex: blush

    - type: title_card
      text: "Lendemain à PolyLAN, 31 mai"
