version: 1

root: "public/assets/game"
excluded:
  - "public/assets/antigrav_test"

technical_direction:
  style: "2D top-down chibi / semi-pixel art"
  camera: "top-down three-quarter view"
  environment_size: "1672x941"
  transparent_assets: true

batches:
  - id: environments
    status: final
    assets:
      - id: anna_room
        status: final
        output: "public/assets/game/environments/prologue/anna-room.png"
        reference: "public/assets/review/batch-03-prologue/anna-room-environment-concept-v1.png"
      - id: alex_room
        status: final
        output: "public/assets/game/environments/prologue/alex-room-v5.png"
        previous_outputs:
          - "public/assets/game/environments/prologue/alex-room.png"
          - "public/assets/game/environments/prologue/alex-room-v2.png"
          - "public/assets/game/environments/prologue/alex-room-v3.png"
          - "public/assets/game/environments/prologue/alex-room-v4.png"
        reference: "public/assets/review/batch-03-prologue/alex-room-environment-concept-v2.png"
      - id: unil_sport
        status: final
        output: "public/assets/game/environments/unil/unil-sport-v12.png"
        previous_outputs:
          - "public/assets/game/environments/unil/unil-sport-v4.png"
          - "public/assets/game/environments/unil/unil-sport-v11.png"
        reference: "public/assets/review/batch-01-first-meeting/first-meeting-environment-concept-v23.png"
      - id: vernand_exterior
        status: final
        output: "public/assets/game/environments/vernand/exterior.png"
        reference: "public/assets/review/batch-02-vernand/vernand-exterior-environment-concept-v1.png"
      - id: vernand_briefing
        status: final
        output: "public/assets/game/environments/vernand/briefing-room.png"
        reference: "public/assets/review/batch-02-vernand/vernand-briefing-room-concept-v1.png"
      - id: vernand_range
        status: final
        output: "public/assets/game/environments/vernand/range-25m-v7.png"
        previous_outputs:
          - "public/assets/game/environments/vernand/range-25m.png"
          - "public/assets/game/environments/vernand/range-25m-v3.png"
          - "public/assets/game/environments/vernand/range-25m-v4.png"
        reference: "public/assets/review/batch-02-vernand/vernand-25m-range-concept-v3.png"
      - id: polylan_hall
